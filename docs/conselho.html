<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conselho Multi-IA Empresarial</title><style>body{font:16px system-ui;margin:auto;max-width:900px;padding:30px;background:#f5f2ed;color:#202020}textarea{width:100%;box-sizing:border-box;padding:15px;border:1px solid #ccc;border-radius:12px}button{margin-top:10px;padding:12px 20px;border:0;border-radius:10px;background:#202020;color:#fff}.box{background:#fff;padding:22px;border-radius:18px;margin-top:20px}.answer{white-space:pre-wrap;line-height:1.55;border-top:1px solid #ddd;padding:16px 0}</style><h1>Conselho Multi-IA</h1><p>Envie uma única demanda. As IAs configuradas analisam o problema de forma independente e o sistema reúne as respostas para comparação.</p><div class="box"><label>Área <select id="cat"><option value="geral">Geral</option><option>estratégia</option><option>pesquisa</option><option>marketing</option><option>financeiro</option><option>pessoas</option><option>tecnologia</option><option>juridico</option></select></label><br><br><textarea id="msg" rows="8" placeholder="Ex.: Quero aumentar o faturamento da empresa em 30%. Analise mercado, posicionamento, riscos e um plano de ação."></textarea><button onclick="enviar()">Consultar o conselho</button><div id="out"></div></div><script>async function enviar(){const out=document.getElementById('out');out.innerHTML='<p>Analisando com o conselho multi-IA...</p>';try{const r=await fetch('/api/multi-ia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:document.getElementById('msg').value,category:document.getElementById('cat').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Erro');out.innerHTML=d.answers.map(x=>'<div class="answer"><b>'+x.provider+'</b><br>'+esc(x.answer)+'</div>').join('')}catch(e){out.innerHTML='<p>'+esc(e.message)+'</p>'}}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</script></html>
